<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <rect width="200" height="200" fill="#101820"/>
  <circle cx="50" cy="50" r="20" fill="#f2aa4c">
    <animate attributeName="opacity" values="1;0.2;1" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="fill" values="#f2aa4c;#4cc9f0;#f2aa4c" dur="2s" repeatCount="indefinite"/>
  </circle>
  <rect x="120" y="30" width="40" height="40" fill="#e63946">
    <animateTransform attributeName="transform" type="rotate" from="0 140 50" to="360 140 50" dur="4s" repeatCount="indefinite"/>
  </rect>
  <path fill="#a8dadc" d="M30 140 L70 140 L70 180 L30 180 Z">
    <animate attributeName="d" dur="2s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.42 0 0.58 1;0.42 0 0.58 1"
      values="M30 140 L70 140 L70 180 L30 180 Z;M50 130 L80 160 L50 190 L20 160 Z;M30 140 L70 140 L70 180 L30 180 Z"/>
  </path>
  <g transform="translate(140 160)">
    <rect x="-15" y="-15" width="30" height="30" fill="#457b9d">
      <animateTransform attributeName="transform" type="scale" values="1;1.5;1" dur="1s" repeatCount="indefinite" additive="sum"/>
    </rect>
  </g>
  <circle cx="100" cy="100" r="8" fill="#fff">
    <animate attributeName="r" values="8;14;8" dur="1s" repeatCount="indefinite" calcMode="discrete"/>
    <animate attributeName="cx" from="90" to="110" dur="2s" repeatCount="indefinite"/>
  </circle>
</svg>
