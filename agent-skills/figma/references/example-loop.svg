<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg">
<style>
@keyframes kf_card_transform_0 {
  0% {
    animation-timing-function: cubic-bezier(0.65, 0, 0.35, 1);
    transform: translateX(78px) translateY(78px) translate(50px, 50px) rotate(0rad) scaleX(1) scaleY(1) translate(-50px, -50px);
  }
  50% {
    animation-timing-function: cubic-bezier(0.65, 0, 0.35, 1);
    transform: translateX(78px) translateY(78px) translate(50px, 50px) rotate(1.571rad) scaleX(1.2) scaleY(1.2) translate(-50px, -50px);
  }
  100% {
    transform: translateX(78px) translateY(78px) translate(50px, 50px) rotate(3.142rad) scaleX(1) scaleY(1) translate(-50px, -50px);
  }
}
@keyframes kf_card_opacity_0 {
  0% {
    animation-timing-function: cubic-bezier(0.65, 0, 0.35, 1);
    opacity: 1;
  }
  50% {
    animation-timing-function: cubic-bezier(0.65, 0, 0.35, 1);
    opacity: 0.6;
  }
  100% {
    opacity: 1;
  }
}
#card {
  transform-origin: 0 0;
  animation:
    kf_card_transform_0 2s linear infinite,
    kf_card_opacity_0 2s linear infinite;
}
@keyframes kf_dot_transform_0 {
  0% {
    animation-timing-function: cubic-bezier(0.34, 1.56, 0.64, 1);
    transform: translateX(122px) translateY(30px);
  }
  50% {
    animation-timing-function: cubic-bezier(0.34, 1.56, 0.64, 1);
    transform: translateX(122px) translateY(214px);
  }
  100% {
    transform: translateX(122px) translateY(30px);
  }
}
#dot {
  transform-origin: 0 0;
  animation: kf_dot_transform_0 4s linear infinite;
}
</style>
<g id="Frame" clip-path="url(#clip0)">
<rect id="bg" width="256" height="256" fill="#0F0F17"/>
<rect id="card" transform="translate(78 78)" width="100" height="100" rx="50" fill="url(#paint0)">
<animate attributeName="rx" values="50; 12; 50" keyTimes="0; 0.5; 1" keySplines="0.65 0 0.35 1; 0.65 0 0.35 1" dur="2s" calcMode="spline" repeatCount="indefinite" />
</rect>
<circle id="dot" transform="translate(122 30)" cx="6" cy="6" r="6" fill="#33E6CC"/>
</g>
<defs>
<linearGradient id="paint0" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
<stop stop-color="#6659FF"/>
<stop offset="1" stop-color="#F26699"/>
</linearGradient>
<clipPath id="clip0">
<rect width="256" height="256" fill="white"/>
</clipPath>
</defs>
</svg>
